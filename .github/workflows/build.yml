name: Compiler Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraire les sources
        run: |
          if [ -f Radar-sources.zip ]; then
            unzip -o -q Radar-sources.zip && git rm -q Radar-sources.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A && git commit -q -m "Sources de Radar extraites"
            git pull -q --rebase && git push
          fi
          if [ ! -f settings.gradle.kts ]; then
            echo "Pas encore de sources : déposez Radar-sources.zip dans le dépôt."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v5
        if: env.SKIP != '1'
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP != '1'
        with: { gradle-version: 8.14.3 }
      - name: Compiler
        if: env.SKIP != '1'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" > /dev/null || true
          base64 -d keystore/radar.jks.b64 > keystore/radar.jks
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "V=$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Radar-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk Radar.apk
      - uses: actions/upload-artifact@v4
        if: env.SKIP != '1'
        with: { name: "Radar-v${{ env.V }}", path: "Radar-v${{ env.V }}.apk" }
      - name: Publier
        if: env.SKIP != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete "v$V" --cleanup-tag -y || true
          gh release create "v$V" "Radar-v$V.apk" Radar.apk --latest -t "Radar $V" -n "Version $V compilée par GitHub Actions (exécution ${{ github.run_number }}). Sur le téléphone : touchez Radar.apk pour l'installer."
      - name: Signaler un échec
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          touch build.log
          (echo '```'; grep -E "error:|FAILED|What went wrong|Could not|Exception" build.log | head -60; echo '...'; tail -40 build.log; echo '```') > issue.md
          gh issue create -t "Échec de compilation ${{ github.run_number }}" -F issue.md

